name: Build Receipt Studio Windows

on:
  push:
    branches: [feature/receipt-studio, main]
    paths:
      - "receipt-studio/**"
      - ".github/workflows/receipt-studio-windows.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: receipt-studio
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Build Windows app
        run: >
          pyinstaller --noconfirm --windowed --name KingsGrillzReceiptStudio
          --add-data "assets;assets"
          --hidden-import kings_grillz.app
          --hidden-import kings_grillz.database
          --hidden-import kings_grillz.pdf
          --hidden-import kings_grillz.png
          --paths .
          launcher.py
      - name: Smoke-test packaged EXE
        shell: pwsh
        run: |
          $exe = "dist\KingsGrillzReceiptStudio\KingsGrillzReceiptStudio.exe"
          if (-not (Test-Path $exe)) { throw "EXE not found: $exe" }
          $proc = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 8
          if ($proc.HasExited) {
            throw "EXE exited immediately with code $($proc.ExitCode)"
          }
          Stop-Process -Id $proc.Id -Force
          Write-Host "EXE stayed running for 8 seconds — startup OK"
      - name: Install Inno Setup
        run: choco install innosetup -y
      - name: Build installer
        shell: pwsh
        run: |
          & "$env:ProgramFiles(x86)\Inno Setup 6\ISCC.exe" installer\ReceiptStudio.iss
      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: kings-grillz-receipt-studio-windows
          path: receipt-studio/installer/output/KingsGrillzReceiptStudio-Setup-1.0.0.exe
