name: Build Receipt Studio Android

on:
  push:
    branches: [main, feature/receipt-studio]
    paths:
      - "android-receipt-studio/**"
      - ".github/workflows/receipt-studio-android.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Build debug APK
        working-directory: android-receipt-studio
        run: gradle assembleDebug --no-daemon
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: kings-grillz-receipt-studio-android
          path: android-receipt-studio/app/build/outputs/apk/debug/app-debug.apk
